name: Final Branding Cleanup

on:
  push:
    branches:
      - feature/v1.3-mod-branding-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/v1.3-mod-branding-cleanup
          fetch-depth: 0

      - name: Apply final branding cleanup
        shell: python
        run: |
          from pathlib import Path
          import json

          root = Path('.')
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if len(path.parts) >= 2 and path.parts[0] == '.github' and path.parts[1] == 'workflows':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = text.replace('Custom GUI Mod', 'RE:volution Mod')
              if new != text:
                  path.write_text(new, encoding='utf-8', newline='')
                  changed.append(str(path))

          gradle = root / 'build.gradle'
          text = gradle.read_text(encoding='utf-8')
          replacements = {
              '"Specification-Title": "examplemod"': '"Specification-Title": "RE:volution Mod"',
              '"Specification-Vendor": "examplemodsareus"': '"Specification-Vendor": "Theyyk"',
              '"Implementation-Title": project.name': '"Implementation-Title": "RE:volution Mod"',
              '"Implementation-Vendor" :"examplemodsareus"': '"Implementation-Vendor" :"Theyyk"',
          }
          new = text
          for old, replacement in replacements.items():
              new = new.replace(old, replacement)
          if new != text:
              gradle.write_text(new, encoding='utf-8', newline='')
              changed.append(str(gradle))

          mcmod = root / 'src/main/resources/mcmod.info'
          data = json.loads(mcmod.read_text(encoding='utf-8'))
          if data and data[0].get('authorList') != ['Theyyk']:
              data[0]['authorList'] = ['Theyyk']
              mcmod.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='')
              changed.append(str(mcmod))

          print('Changed files:')
          for item in sorted(set(changed)):
              print(item)

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finish RE:volution Mod branding cleanup"
          git push origin HEAD:feature/v1.3-mod-branding-cleanup
