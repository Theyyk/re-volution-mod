name: Validate v1.3 Package Migration

on:
  push:
    branches:
      - "feature/v1.3-rune-client-package-split"

permissions:
  contents: read

jobs:
  validate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply package migration in workspace
        run: python3 .github/scripts/migrate-v1.3-rune-client.py

      - name: Show migration summary
        run: git status --short && git diff --stat

      - name: Validate source package paths
        run: python3 .github/scripts/check-structure.py

      - name: Compile migrated project
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" -Dnet.minecraftforge.gradle.check.certs=false clean testClasses
