name: Validate v1.3 Package Migration

on:
  push:
    branches:
      - "feature/v1.3-rune-client-package-split"

permissions:
  contents: write

jobs:
  validate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply package migration in workspace
        run: python3 .github/scripts/migrate-v1.3-rune-client.py

      - name: Show migration summary
        run: git status --short && git diff --stat

      - name: Validate source package paths
        run: python3 .github/scripts/check-structure.py

      - name: Compile migrated project
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" -Dnet.minecraftforge.gradle.check.certs=false clean testClasses

      - name: Commit validated migration
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- gradlew
          git add -A
          if git diff --cached --quiet; then
            echo "Package migration is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: split rune and client packages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
