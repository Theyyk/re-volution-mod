name: Materialize v1.3 Package Finalization

on:
  push:
    branches:
      - feature/v1.3-package-finalization
    paths:
      - '.github/scripts/finalize-v13-packages.py'
      - '.github/workflows/package-finalization.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Materialize package layout
        run: python3 .github/scripts/finalize-v13-packages.py

      - name: Validate diff
        run: git diff --check

      - name: Compile production and tests
        run: ./gradlew compileJava compileTestJava --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Commit materialized package layout
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No package changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: finalize v1.3 package layout'
          git push origin HEAD:feature/v1.3-package-finalization
