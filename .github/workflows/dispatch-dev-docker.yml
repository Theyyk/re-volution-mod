name: Dispatch DEV Docker build

on:
  workflow_run:
    workflows: ['Build and Release']
    branches: [develop]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch successful source run (never execute branch code here)
        env:
          GH_TOKEN: ${{ secrets.RE_VOLUTION_DOCKER }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          # A successful documentation-only run has no gameplay artifact.
          count=$(GH_TOKEN="${{ github.token }}" gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select((.name | startswith("RE-volution-")) and .expired == false)] | length')
          if [ "$count" = 0 ]; then
            echo "No gameplay artifact; no downstream Docker/client chain."
            exit 0
          fi
          test "$count" = 1
          gh api --method POST /repos/Theyyk/re-volution-docker/dispatches \
            -f event_type=mod-dev-build -f "client_payload[run_id]=$SOURCE_RUN_ID"
