name: Dispatch DEV Docker build

on:
  push:
    branches:
      - develop
      - "feature/**"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch exact ref and SHA to Docker repository
        env:
          GH_TOKEN: ${{ secrets.DOCKER_DISPATCH_TOKEN }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DOCKER_DISPATCH_TOKEN is not configured in this repository."
            exit 1
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/Theyyk/re-volution-docker/dispatches \
            -f event_type='mod-dev-build' \
            -F client_payload[ref]="${SOURCE_REF}" \
            -F client_payload[sha]="${SOURCE_SHA}"

          echo "Dispatched ${SOURCE_REF} @ ${SOURCE_SHA} to Theyyk/re-volution-docker"
