name: Dispatch DEV Docker build

on:
  workflow_run:
    workflows: ['Build and Release']
    types: [completed]

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.head_branch != 'master' &&
      github.event.workflow_run.head_branch != 'stable' &&
      github.event.workflow_run.head_branch != 'release' &&
      !startsWith(github.event.workflow_run.head_branch, 'main/') &&
      !startsWith(github.event.workflow_run.head_branch, 'master/') &&
      !startsWith(github.event.workflow_run.head_branch, 'stable/') &&
      !startsWith(github.event.workflow_run.head_branch, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch successful source run (never execute branch code here)
        env:
          GH_TOKEN: ${{ secrets.RE_VOLUTION_DOCKER }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api --method POST /repos/Theyyk/re-volution-docker/dispatches \
            -f event_type=mod-dev-build -f "client_payload[run_id]=$SOURCE_RUN_ID"
