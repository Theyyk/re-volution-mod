name: Validate v1.3 Branding Migration

on:
  push:
    branches:
      - "feature/v1.3-revolution-branding"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply branding migration in workspace
        run: python3 .github/scripts/migrate-v1.3-branding.py

      - name: Show migration summary
        run: git status --short && git diff --stat

      - name: Validate source structure
        run: python3 .github/scripts/check-structure.py

      - name: Build migrated project
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" -Dnet.minecraftforge.gradle.check.certs=false clean build

      - name: Verify migrated artifact
        run: python3 .github/scripts/check-structure.py build/libs/RE-volution-*.jar

      - name: Audit remaining legacy branding
        shell: bash
        run: |
          set -euo pipefail
          echo 'Remaining legacy identifiers outside preserved history/compatibility:'
          git grep -n -I -E 'customguimod|CustomGuiMod|Custom GUI Mod|customgui' -- . \
            ':!/.github/release-notes/*' \
            ':!/docs/releases/*' \
            ':!/docs/cleanup-v1.3-plan.md' \
            ':!/docs/v1.1.4-archive-integration.md' \
            ':!/.github/scripts/check-release-notes.py' \
            ':!/.github/workflows/v1.3-branding-audit.yml' \
            ':!/.github/scripts/migrate-v1.3-branding.py' \
            ':!/.github/workflows/v1.3-branding-migration.yml' \
            ':!/src/main/java/com/example/revolution/BrandingProperties.java' \
            ':!/src/main/java/com/example/revolution/admin/AdminPanelAccess.java' \
            ':!/src/main/java/com/example/revolution/number/LargeNumberDisplaySettings.java' || true

      - name: Commit validated branding migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rename project branding to RE:volution'
          git push origin HEAD:feature/v1.3-revolution-branding
