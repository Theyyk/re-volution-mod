name: Publish v2.12.1 GitHub Release (manual, no PROD)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact reviewed 40-character Gameplay main SHA"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH_V2.12.1 to approve Git tag and GitHub Release only"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-v2.12.1-github-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate owner confirmation, main source and exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v2.12.1
          [[ "$CONFIRMATION" == "PUBLISH_V2.12.1" ]] || { echo "Missing explicit publish confirmation"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid expected SHA"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo "Checkout does not match approved SHA"; exit 1; }
          LIVE_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          [[ "$LIVE_MAIN" == "$EXPECTED_SHA" ]] || { echo "main moved since approval"; exit 1; }

          python3 .github/scripts/check-version-consistency.py --tag "$TAG"
          python3 .github/scripts/check-release-notes.py "$TAG"
          checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100")
          for required in changes build; do
            if ! printf '%s' "$checks" | jq -e --arg name "$required"                 '[.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length > 0' >/dev/null; then
              echo "Required exact-head check did not pass: $required"
              exit 1
            fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Stable GitHub Release already exists: refusing to overwrite"
            exit 1
          fi
          echo "Validated main=$EXPECTED_SHA and exact-head CI for $TAG"

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release JAR from the approved stable commit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -Dnet.minecraftforge.gradle.check.certs=false clean build --build-cache
          python3 .github/scripts/check-structure.py build/libs/RE-volution-*.jar

      - name: Create exact-SHA tag and publish GitHub Release (no PROD dispatch)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v2.12.1
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" == "$EXPECTED_SHA" ]] || {
            echo "main moved during release build; refusing to tag"
            exit 1
          }
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'RE-volution-2.12.1.jar' | sort)
          [[ "${#jars[@]}" -eq 1 ]] || { echo "Expected exactly one v2.12.1 JAR"; exit 1; }
          jar="${jars[0]}"
          sha256sum "$jar"
          stat -c '%n %s bytes' "$jar"

          if tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null); then
            tag_sha=$(printf '%s' "$tag_json" | jq -r '.object.sha')
            tag_type=$(printf '%s' "$tag_json" | jq -r '.object.type')
            [[ "$tag_type" == commit && "$tag_sha" == "$EXPECTED_SHA" ]] || {
              echo "Tag exists at a different commit or unexpected tag type"
              exit 1
            }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"               -f "ref=refs/tags/$TAG" -f "sha=$EXPECTED_SHA" >/dev/null
          fi

          # A tag created with GITHUB_TOKEN does not trigger a second push workflow.
          # Publish the verified JAR directly; no Docker/PROD workflow dispatch.
          gh release create "$TAG" "$jar"             --verify-tag             --title "RE:volution Mod $TAG"             --notes-file ".github/release-notes/$TAG.md"

          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,url
          {
            echo "### Published $TAG"
            echo "Source: \`$EXPECTED_SHA\`"
            echo "Artifact: \`$(basename "$jar")\`"
            echo "SHA256: \`$(sha256sum "$jar" | cut -d' ' -f1)\`"
            echo "GitHub Release only; no PROD deployment"
          } >> "$GITHUB_STEP_SUMMARY"
