name: Build and Release

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject permission-pending GUI assets
        shell: bash
        run: |
          set -euo pipefail

          # Five/Seven OTF decision and source: docs/permissions/cristalix.md
          forbidden_paths=(
            "src/main/java/com/example/customguimod/CristalixGuiTheme.java"
            "src/main/resources/assets/customguimod/themes/cristalix"
            "src/main/resources/assets/customguimod/textures/gui/cristalix"
          )

          found=0
          for path in "${forbidden_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "Permission-pending asset/theme must not be included in a public build: $path"
              found=1
            fi
          done

          if [ "$found" -ne 0 ]; then
            exit 1
          fi

          echo "Public-build asset guard passed."

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate version consistency
        run: python3 .github/scripts/check-version-consistency.py

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/check-version-consistency.py --tag "${GITHUB_REF_NAME}"

      - name: Validate release descriptions
        shell: bash
        run: |
          PROJECT_VERSION=$(grep -E "^[[:space:]]*version[[:space:]]*=" build.gradle | head -n 1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          python3 .github/scripts/check-release-notes.py "v${PROJECT_VERSION}"

      - name: Check source terminology and package paths
        run: python3 .github/scripts/check-structure.py

      - name: Build mod
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" -Dnet.minecraftforge.gradle.check.certs=false clean build

      - name: Verify packaged classes and resources
        run: python3 .github/scripts/check-structure.py build/libs/customguimod-*.jar

      - name: Prepare artifact name
        id: artifact_name
        shell: bash
        run: |
          SAFE_REF_NAME=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')
          echo "ref=${SAFE_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: customguimod-${{ steps.artifact_name.outputs.ref }}
          path: build/libs/customguimod-*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/customguimod-*.jar \
            --title "Custom GUI Mod ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"

      - name: Delete merged feature and release branches
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name | select(startswith("feature/") or startswith("release/"))'
          )

          if [ "${#branches[@]}" -eq 0 ]; then
            echo "No feature/* or release/* branches to inspect."
            exit 0
          fi

          for branch in "${branches[@]}"; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.status')

            case "$status" in
              behind|identical)
                echo "Deleting merged branch: $branch ($status main)"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
                ;;
              *)
                echo "Keeping branch with commits not fully merged into main: $branch ($status)"
                ;;
            esac
          done
