name: Build and Release

on:
  pull_request:
    branches: [develop]
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
      startup: ${{ steps.changes.outputs.startup }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate all workflows with actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color -shellcheck= -pyflakes=
      - name: Test change detection policy
        run: python3 .github/ci/test_changes.py
      - name: Select affected components (manual/tag/unknown diff runs all)
        id: changes
        run: python3 .github/ci/changes.py

      - name: Validate version consistency
        run: python3 .github/scripts/check-version-consistency.py

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/check-version-consistency.py --tag "${GITHUB_REF_NAME}"

      - name: Validate release descriptions
        shell: bash
        run: |
          PROJECT_VERSION=$(grep -E "^[[:space:]]*version[[:space:]]*=" build.gradle | head -n 1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          python3 .github/scripts/check-release-notes.py "v${PROJECT_VERSION}"

      - name: Check source terminology and package paths
        run: python3 .github/scripts/check-structure.py

  startup-launcher:
    needs: changes
    if: needs.changes.outputs.startup == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static Realm 0 startup and separate copy entry points
        shell: powershell
        run: ./tools/startup/Test-RealmLauncher.ps1
      - name: Verify directional Realm 0 copies and live Build snapshot recovery
        shell: powershell
        run: ./tools/startup/Test-RealmOverworldSync.ps1

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject permission-pending GUI assets
        shell: bash
        run: |
          set -euo pipefail

          forbidden_paths=(
            "src/main/java/com/example/revolution/CristalixGuiTheme.java"
            "src/main/resources/assets/revolution/themes/cristalix"
            "src/main/resources/assets/revolution/textures/gui/cristalix"
          )

          found=0
          for path in "${forbidden_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "Permission-pending asset/theme must not be included in a public build: $path"
              found=1
            fi
          done

          if [ "$found" -ne 0 ]; then
            exit 1
          fi

          echo "Public-build asset guard passed."

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew -Dnet.minecraftforge.gradle.check.certs=false clean build --build-cache

      - name: Verify packaged classes and resources
        run: python3 .github/scripts/check-structure.py build/libs/RE-volution-*.jar

      - name: Prepare artifact name
        id: artifact_name
        shell: bash
        run: |
          SAFE_REF_NAME=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')
          echo "ref=${SAFE_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RE-volution-${{ steps.artifact_name.outputs.ref }}
          path: build/libs/RE-volution-*.jar
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/RE-volution-*.jar \
            --title "RE:volution Mod ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"

      - name: Trigger production gameplay manifest rollout
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.CLIENT_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CLIENT_DISPATCH_TOKEN is not configured. The stable release exists, but instant production manifest rollout cannot be triggered. The scheduled fallback remains available in re-volution-client."
            exit 1
          fi

          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg release_sha "$RELEASE_SHA" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            '{event_type:"gameplay-release",client_payload:{release_tag:$release_tag,release_sha:$release_sha,source_repository:$source_repository}}' \
            | gh api --method POST repos/Theyyk/re-volution-client/dispatches --input -

          echo "Triggered production gameplay manifest rollout for ${RELEASE_TAG}."

      - name: Delete merged feature and release branches
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name | select(startswith("feature/") or startswith("release/"))'
          )

          if [ "${#branches[@]}" -eq 0 ]; then
            echo "No feature/* or release/* branches to inspect."
            exit 0
          fi

          for branch in "${branches[@]}"; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.status')

            case "$status" in
              behind|identical)
                echo "Deleting merged branch: $branch ($status main)"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
                ;;
              *)
                echo "Keeping branch with commits not fully merged into main: $branch ($status)"
                ;;
            esac
          done
