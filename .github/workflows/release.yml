name: Build and Release

on:
  pull_request:
    branches: [develop]
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

permissions:
  contents: write
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
      startup: ${{ steps.changes.outputs.startup }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate all workflows with actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color -shellcheck= -pyflakes=
      - name: Test change detection policy
        run: python3 .github/ci/test_changes.py
      - name: Test DEV dispatcher routing policy
        run: node .github/ci/test_dev_dispatcher.cjs
      - name: Select affected components (manual/tag/unknown diff runs all)
        id: changes
        run: python3 .github/ci/changes.py

      - name: Validate version consistency
        run: python3 .github/scripts/check-version-consistency.py

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/check-version-consistency.py --tag "${GITHUB_REF_NAME}"

      - name: Validate release descriptions
        shell: bash
        run: |
          PROJECT_VERSION=$(grep -E "^[[:space:]]*version[[:space:]]*=" build.gradle | head -n 1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          python3 .github/scripts/check-release-notes.py "v${PROJECT_VERSION}"

      - name: Check source terminology and package paths
        run: python3 .github/scripts/check-structure.py

  startup-launcher:
    needs: changes
    if: needs.changes.outputs.startup == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static Realm 0 startup and separate copy entry points
        shell: powershell
        run: ./tools/startup/Test-RealmLauncher.ps1
      - name: Verify directional Realm 0 copies and live Build snapshot recovery
        shell: powershell
        run: ./tools/startup/Test-RealmOverworldSync.ps1

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject permission-pending GUI assets
        shell: bash
        run: |
          set -euo pipefail

          forbidden_paths=(
            "src/main/java/com/example/revolution/CristalixGuiTheme.java"
            "src/main/resources/assets/revolution/themes/cristalix"
            "src/main/resources/assets/revolution/textures/gui/cristalix"
          )

          found=0
          for path in "${forbidden_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "Permission-pending asset/theme must not be included in a public build: $path"
              found=1
            fi
          done

          if [ "$found" -ne 0 ]; then
            exit 1
          fi

          echo "Public-build asset guard passed."

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew -Dnet.minecraftforge.gradle.check.certs=false clean build --build-cache

      - name: Verify packaged classes and resources
        run: python3 .github/scripts/check-structure.py build/libs/RE-volution-*.jar

      - name: Prepare immutable DEV gameplay OCI image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        id: gameplay
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name 'RE-volution-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)
          test -n "$JAR"
          VERSION=$(grep -E "^[[:space:]]*version[[:space:]]*=" build.gradle | head -n 1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          HASH=$(sha256sum "$JAR" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$JAR")
          test -n "$VERSION"
          test "$SIZE" -gt 0
          mkdir -p build/gameplay-oci
          cp "$JAR" build/gameplay-oci/RE-volution.jar
          cat > build/gameplay-oci/Dockerfile <<'EOF'
          FROM scratch
          ARG MOD_SHA
          ARG MOD_REF
          ARG MOD_VERSION
          ARG MOD_JAR_SHA256
          ARG MOD_JAR_SIZE
          ARG MOD_SOURCE_RUN_ID
          ARG MOD_SOURCE_RUN_ATTEMPT
          LABEL org.opencontainers.image.title="RE-volution DEV Gameplay" \
                org.opencontainers.image.source="https://github.com/Theyyk/re-volution-mod" \
                org.opencontainers.image.revision="${MOD_SHA}" \
                re.vol.mod.ref="${MOD_REF}" \
                re.vol.mod.version="${MOD_VERSION}" \
                re.vol.mod.jar.sha256="${MOD_JAR_SHA256}" \
                re.vol.mod.jar.size="${MOD_JAR_SIZE}" \
                re.vol.mod.source.run-id="${MOD_SOURCE_RUN_ID}" \
                re.vol.mod.source.run-attempt="${MOD_SOURCE_RUN_ATTEMPT}"
          COPY RE-volution.jar /RE-volution.jar
          EOF
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for DEV gameplay package
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx for DEV gameplay package
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/setup-buildx-action@v3

      - name: Publish exact DEV gameplay package
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: build/gameplay-oci
          file: build/gameplay-oci/Dockerfile
          push: true
          tags: ghcr.io/theyyk/re-volution-gameplay-dev:sha-${{ github.sha }}
          provenance: false
          build-args: |
            MOD_SHA=${{ github.sha }}
            MOD_REF=${{ github.ref_name }}
            MOD_VERSION=${{ steps.gameplay.outputs.version }}
            MOD_JAR_SHA256=${{ steps.gameplay.outputs.hash }}
            MOD_JAR_SIZE=${{ steps.gameplay.outputs.size }}
            MOD_SOURCE_RUN_ID=${{ github.run_id }}
            MOD_SOURCE_RUN_ATTEMPT=${{ github.run_attempt }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/RE-volution-*.jar \
            --title "RE:volution Mod ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"

      - name: Trigger production gameplay manifest rollout
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.CLIENT_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CLIENT_DISPATCH_TOKEN is not configured. The stable release exists, but instant production manifest rollout cannot be triggered. The scheduled fallback remains available in re-volution-client."
            exit 1
          fi

          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg release_sha "$RELEASE_SHA" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            '{event_type:"gameplay-release",client_payload:{release_tag:$release_tag,release_sha:$release_sha,source_repository:$source_repository}}' \
            | gh api --method POST repos/Theyyk/re-volution-client/dispatches --input -

          echo "Triggered production gameplay manifest rollout for ${RELEASE_TAG}."

      - name: Delete merged feature and release branches
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name | select(startswith("feature/") or startswith("release/"))'
          )

          if [ "${#branches[@]}" -eq 0 ]; then
            echo "No feature/* or release/* branches to inspect."
            exit 0
          fi

          for branch in "${branches[@]}"; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.status')

            case "$status" in
              behind|identical)
                echo "Deleting merged branch: $branch ($status main)"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
                ;;
              *)
                echo "Keeping branch with commits not fully merged into main: $branch ($status)"
                ;;
            esac
          done
