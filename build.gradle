buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.73'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.3.10'
group = 'com.example.revolution'
archivesBaseName = 'RE-volution'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    implementation 'org.mongodb:mongodb-driver-sync:4.5.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

repositories {
    mavenCentral()
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            logger.lifecycle("JUnit: ${result.testCount} tests, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped")
            if (result.testCount == 0) throw new GradleException('No JUnit tests executed')
        }
    }
}
configurations.configureEach {
    resolutionStrategy {
        force 'net.minecraftforge:mergetool:0.2.3.3'
    }
}

def sourceEpoch = System.getenv('SOURCE_DATE_EPOCH')
if (sourceEpoch == null) {
    def result = new ByteArrayOutputStream()
    def status = exec {
        commandLine 'git', 'log', '-1', '--format=%ct'
        standardOutput = result
        ignoreExitValue = true
    }
    sourceEpoch = status.exitValue == 0 ? result.toString().trim() : '0'
}
sourceEpoch = Long.parseLong(sourceEpoch)
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    outputs.cacheIf { false }
}

jar {
    manifest {
        attributes([
            "Specification-Title": "RE:volution Mod",
            "Specification-Vendor": "Theyyk",
            "Specification-Version": "1",
            "Implementation-Title": "RE:volution Mod",
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "Theyyk",
            "Implementation-Timestamp": new Date(sourceEpoch * 1000L).format("yyyy-MM-dd'T'HH:mm:ssZ", TimeZone.getTimeZone("UTC"))
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven { url = uri('mcmodsrepo') }
    }
}

def regressionTests = [
    realmStartupSyncRegression: 'com.example.revolution.realm.world.RealmStartupSyncTest',
    runeInventoryRegression: 'com.example.revolution.rune.state.RuneInventoryTest',
    guiLayoutRegression: 'com.example.revolution.client.GuiLayoutTest',
    runeEconomyRegression: 'com.example.revolution.rune.config.RuneEconomyConfigTest',
    primaryRuneCatalogRegression: 'com.example.revolution.rune.definition.PrimaryRuneCatalogTest',
    runeTooltipContentRegression: 'com.example.revolution.client.RuneTooltipContentTest',
    runeStatContentRegression: 'com.example.revolution.rune.definition.RuneStatContentTest',
    runeCombatMathRegression: 'com.example.revolution.client.RuneCombatMathTest',
    mobRewardBonusRegression: 'com.example.revolution.rune.rules.MobRewardBonusTest',
    runeEnhancementPacketRegression: 'com.example.revolution.client.RuneEnhancementPacketTest',
    multiStatusRuneRegression: 'com.example.revolution.rune.config.RuneStatusConfigTest',
    multiStatusRuneEconomyRegression: 'com.example.revolution.rune.config.MultiStatusRuneEconomyTest',
    resourceActionFoundationRegression: 'com.example.revolution.resource.service.ResourceActionFoundationTest',
    realmFoundationRegression: 'com.example.revolution.realm.definition.RealmCatalogTest',
    locationFoundationRegression: 'com.example.revolution.location.LocationFoundationTest',
    stageTransitionRegression: 'com.example.revolution.location.service.StageTransitionServiceTest',
    stageTransitionTriggerDefinitionRegression: 'com.example.revolution.location.service.StageTransitionTriggerDefinitionTest',
    largeNumberFormatterRegression: 'com.example.revolution.number.LargeNumberFormatterTest',
    mobVirtualHealthRegression: 'com.example.revolution.mob.rules.MobVirtualHealthTest',
    mobContributionRegression: 'com.example.revolution.mob.rules.MobContributionTest',
    mobProgressionRegression: 'com.example.revolution.mob.rules.MobProgressionTest',
    runeTransportContractRegression: 'com.example.revolution.network.RuneTransportContractTest',
    enhancementRateLimitRegression: 'com.example.revolution.network.EnhancementRequestLimiterTest',
    networkWireContractRegression: 'com.example.revolution.network.NetworkWireContractTest',
    fileAdminWhitelistRepositoryRegression: 'com.example.revolution.persistence.FileAdminWhitelistRepositoryTest',
    mongoSchemaContractRegression: 'com.example.revolution.persistence.MongoSchemaContractTest',
    resourceServiceRegression: 'com.example.revolution.resource.service.ResourceServiceTest',
    runeCombatServiceRegression: 'com.example.revolution.rune.service.RuneCombatServiceTest',
    adminApiSecurityRegression: 'com.example.revolution.admin.api.auth.AdminApiSecurityTest',
    adminApiInputValidationRegression: 'com.example.revolution.admin.api.AdminApiInputValidationTest'
]
regressionTests.each { taskName, entryPoint ->
    def regression = tasks.register(taskName, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = entryPoint
    }
    tasks.named('check').configure { dependsOn regression }
}

def pythonExecutable = providers.gradleProperty('pythonExecutable').getOrElse('python')
tasks.register('architectureCheck', Exec) {
    commandLine pythonExecutable, '.github/scripts/check-architecture.py'
}
tasks.register('architectureGuardRegression', Exec) {
    commandLine pythonExecutable, '.github/scripts/test-architecture-guards.py'
}
tasks.register('adminApiSecurityCheck', Exec) {
    commandLine pythonExecutable, '.github/scripts/check-admin-api-security.py'
}
tasks.named('check').configure { dependsOn 'architectureCheck', 'architectureGuardRegression', 'adminApiSecurityCheck' }

apply from: 'gradle/reproducible-jar.gradle'
